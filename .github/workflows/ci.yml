name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint, and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble Android debug APK
        run: ./gradlew :apps:androidApp:assembleDebug

  ios:
    name: iOS framework and app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared iOS framework
        run: ./gradlew :shared:navigation:linkDebugFrameworkIosSimulatorArm64

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS app for simulator
        run: |
          cd apps/iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -configuration Debug build
